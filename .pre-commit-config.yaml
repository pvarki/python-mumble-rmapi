# >>> BEGIN AUTOGENERATED SECTION - config-ci-library
# Do not modify this section directly, instead modify the
# components in pre-commit/configs/components/ and run the
# generate script or commit to trigger regeneration
#
# Generated from:
#   - pre-commit/configs/components/common-base.pre-commit-config-component.yaml
#   - pre-commit/configs/components/common-format.pre-commit-config-component.yaml
#   - pre-commit/configs/components/python.pre-commit-config-component.yaml
#   - pre-commit/configs/components/typescript.pre-commit-config-component.yaml
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        stages: [pre-commit]
      - id: check-executables-have-shebangs
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
        exclude: '(poetry|uv|yarn)\.lock$|package-lock\.json$|pnpm-lock\.yaml$'
      - id: check-case-conflict
        stages: [pre-commit]
      - id: check-symlinks
        stages: [pre-commit]
  - repo: https://github.com/Lucas-C/pre-commit-hooks-markup
    rev: v1.0.1
    hooks:
      - id: rst-linter
        stages: [pre-commit]
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: forbid-crlf
        stages: [pre-commit]
      - id: remove-crlf
        stages: [pre-commit]
      - id: forbid-tabs
        stages: [pre-commit]
        exclude: '\.go$|go\.(mod|sum)$'
      - id: remove-tabs
        stages: [pre-commit]
        exclude: '\.go$|go\.(mod|sum)$'
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.10
    hooks:
      - id: actionlint
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: "poetry.lock|ui/pnpm-lock.yaml"
        args: [--baseline, .secrets.baseline]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: Prettier
        files: \.(yml|yaml|json|md)$
        args:
          - --tab-width=2
          - --use-tabs=false
          - --cache-location=.prettier_cache
        stages: [pre-commit]
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.9
    hooks:
      - id: uv-lock
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format
        types_or: [python, pyi]
        stages: [pre-commit]
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.2
    hooks:
      - id: bandit
        stages: [pre-commit]
        args: ["--exclude", ".tox,.eggs,tests"]
  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 1.3.2
    hooks:
      - id: pyrefly-check
        pass_filenames: false # Recommended to do full repo checks. However, you can change this to `true` to only check changed files
        language: system # Use system-installed pyrefly
  - repo: local # Local hooks so versions track the project's package.json
    hooks:
      - id: prettier-ts
        name: Prettier (TypeScript / JS / CSS / HTML)
        entry: ui/node_modules/.bin/prettier --write
        language: system
        types_or: [ts, tsx, javascript, jsx, css, scss, html]
        files: ^ui
        stages: [pre-commit]
      - id: eslint
        name: ESLint
        entry: ui/node_modules/.bin/eslint --fix
        language: system
        types_or: [ts, tsx, javascript, jsx]
        files: ^ui
        stages: [pre-commit]
      - id: tsc
        name: TypeScript type check
        entry: ui/node_modules/.bin/tsc -p ui --noEmit
        language: system
        types_or: [ts, tsx]
        pass_filenames: false
        stages: [pre-commit]
  # >>> END AUTOGENERATED SECTION - config-ci-library
  # Add any repo-specific hooks below this line
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src tests
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        stages: [pre-commit]
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        files: ^(src|tests|templates)/
        pass_filenames: false
        stages: [pre-commit]
      - id: test-ui
        name: Unit tests (ui)
        entry: pnpm -C ui test
        language: system
        files: ^ui/
        pass_filenames: false
        stages: [pre-commit]
# pnpm writes its own lockfile
exclude: ^ui/pnpm-lock\.yaml$
